name: VCORE CI/CD Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      - name: Build VCORE containers
        run: |
          docker build -t vcore-nexus ./vcore_nexus_suite

      - name: Deploy Nexus Core
        run: |
          bash ./vcore_nexus_suite/install.sh
