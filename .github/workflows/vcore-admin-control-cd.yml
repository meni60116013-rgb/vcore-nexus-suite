name: VCORE Admin ↔ Control Plane CD

on:
  push:
    branches:
      - main

jobs:
  deploy-admin-control:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compile Panel Admin
        run: |
          cd vcore_admin_native
          javac Main.java
          java Main

      - name: Connect to Control Plane
        run: |
          cd vcore_control_plane
          npm install
          node server.js &
          sleep 5
          curl http://localhost:8080 || echo "❌ No se pudo conectar"
          pkill -f "node server.js"
