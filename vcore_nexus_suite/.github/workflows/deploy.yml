name: VCORE CI/CD Cloud Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      - name: Build VCORE containers
        run: |
          docker build -t vcore-nexus ./vcore_nexus_suite

      - name: Deploy to Cloud (Azure/AWS/GCP)
        run: |
          kubectl apply -f ./vcore_nexus_suite/deployment.yaml
